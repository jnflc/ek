<script type="text/javascript"><![CDATA[
(function(){
  var svg=document.getElementById('diagramm');
  if(!svg||!svg.querySelector||!svg.classList) return;
  var kanten=svg.querySelector('#kanten');
  var edges=[].slice.call(svg.querySelectorAll('g.edge'));
  var info={}, outE={}, inE={};
  edges.forEach(function(g){
    var c=g.getAttribute('class');
    var s=/(?:^|\s)s-(\S+)/.exec(c)[1], t=/(?:^|\s)t-(\S+)/.exec(c)[1];
    info[g.id]={s:s,t:t};
    (outE[s]=outE[s]||[]).push(g.id); (inE[t]=inE[t]||[]).push(g.id);
    var ln=g.querySelector('.ln'), hit=ln.cloneNode(false);
    hit.setAttribute('class','hit'); hit.setAttribute('stroke','#000');
    hit.setAttribute('stroke-opacity','0'); hit.setAttribute('stroke-width','16');
    g.appendChild(hit);
  });
  var nodes={};
  [].forEach.call(svg.querySelectorAll('g.node'),function(n){nodes[n.id]=n;});
  var labels=[].slice.call(svg.querySelectorAll('g.elabel'));
  var selNodes=[], selEdge=null, preview=null;
  function tog(el,c,on){ if(on) el.classList.add(c); else el.classList.remove(c); }
  function render(){
    var act=selNodes.slice();
    if(!act.length && !selEdge && preview) act=[preview];
    var hout={}, hin={}, hsel={}, nb={};
    act.forEach(function(n){
      (outE[n]||[]).forEach(function(e){ hout[e]=1; nb[info[e].t]=1; });
      (inE[n]||[]).forEach(function(e){ if(!hout[e]) hin[e]=1; nb[info[e].s]=1; });
    });
    if(selEdge){ hsel[selEdge]=1; nb[info[selEdge].s]=1; nb[info[selEdge].t]=1; }
    tog(svg,'dim', act.length>0 || !!selEdge);
    edges.forEach(function(g){
      var id=g.id, o=!!hout[id], i=!!hin[id] && !o, sl=!!hsel[id];
      tog(g,'hl-out',o); tog(g,'hl-in',i); tog(g,'hl-sel',sl);
      if((o||i||sl) && kanten) kanten.appendChild(g);
    });
    for(var k in nodes){ tog(nodes[k],'sel',act.indexOf(k)>=0); tog(nodes[k],'nb',!!nb[k]); }
    labels.forEach(function(l){ var e=l.getAttribute('data-e'); tog(l,'on',!!(hout[e]||hin[e]||hsel[e])); });
  }
  function up(el,sel){ while(el && el!==svg){ if(el.matches && el.matches(sel)) return el; el=el.parentNode; } return null; }
  svg.addEventListener('click',function(ev){
    var node=up(ev.target,'g.node'), edge=node?null:up(ev.target,'g.edge');
    var multi=ev.shiftKey||ev.ctrlKey||ev.metaKey;
    if(node){
      var id=node.id, i=selNodes.indexOf(id); selEdge=null;
      if(multi){ if(i>=0) selNodes.splice(i,1); else selNodes.push(id); }
      else selNodes=(i>=0 && selNodes.length===1)?[]:[id];
    } else if(edge){
      selNodes=[]; selEdge=(selEdge===edge.id)?null:edge.id;
    } else { selNodes=[]; selEdge=null; }
    preview=null; render();
  });
  svg.addEventListener('pointerover',function(ev){
    if(ev.pointerType!=='mouse') return;
    var n=up(ev.target,'g.node'), p=n?n.id:null;
    if(p!==preview){ preview=p; if(!selNodes.length && !selEdge) render(); }
  });
  svg.addEventListener('pointerleave',function(){ if(preview){ preview=null; if(!selNodes.length && !selEdge) render(); } });
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'){ selNodes=[]; selEdge=null; preview=null; render(); } });
})();
]]></script>
</svg>
